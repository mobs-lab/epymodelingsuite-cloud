# Staging pipeline environment configuration
#
# Location: ~/.config/epymodelingsuite-cloud/environments/staging.yaml
#
# Selected with `epycloud --env staging ...`. This is the blue/green staging
# pipeline: a second Cloud Workflows workflow assembled from the staging main and
# subworkflow templates. Production is untouched until their assembled source
# is promoted to terraform/workflow.yaml.
#
# Named staging rather than dev on purpose. "dev" is already overloaded in
# this project: the dev git branch, the dev image tag, and
# github.modeling_suite_ref: dev. This environment is about which *workflow*
# runs, which is a separate axis from which code or image it runs.

google_cloud:
  # Second workflow deployed by terraform (var.enable_staging_workflow).
  workflow_name: epymodelingsuite-pipeline-staging

storage:
  # {environment} resolves to "staging", so runs land under
  # pipeline/staging/.
  #
  # CAVEAT: profiles are merged AFTER environments, so a profile that pins
  # storage.dir_prefix (e.g. profiles/flu.yaml with "pipeline/flu") wins over
  # this key and staging runs share the production prefix. Artifacts still cannot
  # collide, since run_id is unique per execution, but they interleave in the
  # same tree. To separate them, either use a dedicated --exp-id, or drop a
  # project config next to the worktree (./epycloud.yaml overrides the profile):
  #   storage:
  #     dir_prefix: "pipeline/staging/flu"
  dir_prefix: "pipeline/{environment}/{profile}"

# imageTag is a runtime workflow input, so pointing this environment at its own
# image needs no terraform apply. Left commented out so staging runs the same image
# as production by default, and a workflow change is the only variable.
# docker:
#   image_tag: dev

logging:
  level: DEBUG
  storage_verbose: true
